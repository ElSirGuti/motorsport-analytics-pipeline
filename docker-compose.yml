# Full stack in containers: PostgreSQL + FastAPI backend + nginx/React frontend.
#
#   cp .env.example .env        # then edit the passwords
#   docker compose up --build   # UI on http://localhost:${FRONTEND_PORT:-8080}
#
# Dev profile (backend with hot reload + bind mount; run vite locally on :5173):
#   docker compose --profile dev up postgres backend-dev
#
# Names/ports here mirror k8s/base (Service "backend":8000, "frontend":8080, "postgres":5432).

name: motorsport

x-backend-env: &backend-env
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
  TEMP_DIR: /tmp/motorsport-analytics
  STORAGE_DIR: /app/data/storage
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-motorsport}:${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-motorsport}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motorsport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-motorsport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: motorsport-backend:dev
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - storage:/app/data/storage
    networks: [backend-net, frontend-net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}
        reservations: {memory: 1G}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: motorsport-frontend:dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [frontend-net]
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}

  # ── dev profile: hot-reload backend on the host (no frontend container) ──
  backend-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile
    image: motorsport-backend:dev
    environment:
      <<: *backend-env
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RUN_MIGRATIONS: "1"
      LOG_LEVEL: DEBUG
    volumes:
      - ./:/app
      - storage-dev:/app/data/storage
    ports:
      - "127.0.0.1:${BACKEND_DEV_PORT:-8010}:8000"
    networks: [backend-net, frontend-net]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "[ \"$$RUN_MIGRATIONS\" = 1 ] && [ -f alembic.ini ] && alembic upgrade head; exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]

networks:
  # backend-net is internal: postgres is never reachable from outside the compose project.
  backend-net:
    internal: true
  frontend-net: {}

volumes:
  pgdata:
  storage:
  storage-dev:
