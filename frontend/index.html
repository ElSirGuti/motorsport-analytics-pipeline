<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d1014" />
    <script>
      /* Apply the saved theme before first paint (no flash). Keep in sync with src/hooks/useTheme.js */
      (function () {
        var pref = 'system';
        try { var v = localStorage.getItem('ma-theme'); if (v === 'light' || v === 'dark') pref = v; } catch (e) {}
        var dark = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        var t = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.setAttribute('data-theme-pref', pref);
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f2f4f8' : '#0d1014');
      })();
    </script>
    <meta name="description" content="Plataforma profesional de análisis de telemetría para motorsport. Compara vueltas, detecta pérdidas de tiempo y optimiza tu pilotaje." />
    <title>Motorsport Analytics — El Analista Automatizado</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
