# EXAMPLE ONLY (requires the external-secrets operator and a configured SecretStore).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: motorsport-db
  namespace: motorsport
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: REPLACE_ME
  target:
    name: motorsport-db
  data:
    - secretKey: POSTGRES_USER
      remoteRef: {key: motorsport/db, property: user}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: motorsport/db, property: password}
    - secretKey: POSTGRES_DB
      remoteRef: {key: motorsport/db, property: database}
