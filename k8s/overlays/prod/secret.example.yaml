# EXAMPLE ONLY -- not referenced by kustomization.yaml on purpose, so it can never be applied by
# accident. Do NOT commit real values. Options, best first:
#   1. external-secrets: see externalsecret.example.yaml (values live in Vault/AWS SM/GCP SM)
#   2. sealed-secrets:   kubectl create secret generic motorsport-db --dry-run=client -o yaml \
#                          --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... \
#                          --from-literal=POSTGRES_DB=motorsport -n motorsport \
#                        | kubeseal --format yaml > sealedsecret.yaml   (this file is safe to commit)
#   3. imperative:       kubectl -n motorsport create secret generic motorsport-db ...
# The password is embedded in a URL: use only URL-safe characters (letters, digits, - . _ ~).
apiVersion: v1
kind: Secret
metadata:
  name: motorsport-db
  namespace: motorsport
type: Opaque
stringData:
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: motorsport
