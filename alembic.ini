[alembic]
script_location = alembic
# El script de consola `alembic` no pone el cwd en sys.path: sin esto env.py no puede
# importar `src.db` (fallaba en el contenedor / initContainer de k8s).
prepend_sys_path = .
path_separator = os
# La URL se toma de DATABASE_URL (ver alembic/env.py)
sqlalchemy.url =
